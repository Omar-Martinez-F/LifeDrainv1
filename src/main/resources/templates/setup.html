<!DOCTYPE html>
<html lang="en" xmlns:th="https://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LifeDrain</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body class="setup-page">
    <main class = "setup-container">
        <h1> LifeDrain </h1>
        <p>Configure your Magic game.</p>

        <form th:action="@{/game}" method = "get">
            <div class="form-field">
                <label for="mode">Game mode</label>

                <select id="mode" name="mode">
                    <option 
                        th:each="gameMode : ${gameModes}"
                        th:value="${gameMode.name()}"
                        th:text="${gameMode.displayName}"
                        th:attr="data-default-players=${gameMode.defaultPlayers}"
                    >
                        Standard
                    </option>
                </select>
            </div>
        
        <div class = "form-field">
            <label for="players">Number of players</label>

            <input
                id="players"
                name="players"
                min="1"
                max="4"
                value = "2"
                required
                >
        </div>
        <button type="submit"> Start game </button>   
        </form>
    </main>


    <script>
        const modeSelect = document.querySelector("#mode");
        const playInput = document.querySelector("#players");

        modeSelect.addEventListener("change", () => {
            const selectedOption = modeSelect.options[modeSelect.selectedIndex];

            playerInput.value = selectedOption.dataset.defaultPlayers;
        });
</body>
</html>
